<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Block & Bulk Deals — TradeProof</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html"><span class="logo-mark"></span>TradeProof</a>
      <button class="nav-toggle" type="button" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html" data-nav="index.html">Home</a></li>
        <li><a href="dashboard.html" data-nav="dashboard.html">Market Pulse</a></li>
        <li><a href="signals.html" data-nav="signals.html">Breakouts</a></li>
        <li><a href="options.html" data-nav="options.html">Nifty Options</a></li>
        <li><a href="penny.html" data-nav="penny.html">Penny</a></li>
        <li><a href="deals.html" data-nav="deals.html">Deals</a></li>
      </ul>
      <a class="nav-cta" href="stock.html?symbol=RELIANCE">Sample stock →</a>
    </div>
  </header>

  <main class="page container">
    <div class="page-header">
      <div class="eyebrow">NSE block · bulk prints</div>
      <h1>Deals Desk</h1>
      <p>Large institutional prints — pick a date range (up to the last 30 days of available feed data).</p>
    </div>

    <div class="toolbar rise">
      <select id="typeFilter">
        <option value="all">All deal types</option>
        <option value="Block">Block only</option>
        <option value="Bulk">Bulk only</option>
      </select>
      <select id="sideFilter">
        <option value="all">Buy & sell</option>
        <option value="Buy">Buy side</option>
        <option value="Sell">Sell side</option>
      </select>
      <label class="toolbar-label" for="fromDate">From</label>
      <input type="date" id="fromDate" />
      <label class="toolbar-label" for="toDate">To</label>
      <input type="date" id="toDate" />
      <select id="rangePreset">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
        <option value="custom">Custom range</option>
      </select>
      <span id="dealCount" style="color:var(--text-muted);font-size:0.85rem;margin-left:auto"></span>
    </div>

    <div class="grid-3" style="margin-bottom:1.25rem" id="dealStats"></div>

    <div class="deal-list rise rise-d1" id="dealList"></div>
  </main>

  <footer class="site-footer" data-footer></footer>
  <script src="js/data.js"></script>
  <script src="js/live.js"></script>
  <script src="js/app.js"></script>
  <script>
    function isoDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function setPresetDays(days) {
      const to = new Date();
      const from = new Date();
      from.setDate(to.getDate() - (days - 1));
      document.getElementById("toDate").value = isoDate(to);
      document.getElementById("fromDate").value = isoDate(from);
      const min = new Date();
      min.setDate(to.getDate() - 29);
      document.getElementById("fromDate").min = isoDate(min);
      document.getElementById("toDate").min = isoDate(min);
      document.getElementById("fromDate").max = isoDate(to);
      document.getElementById("toDate").max = isoDate(to);
    }

    function dealDateKey(d) {
      if (d.date && /^\d{4}-\d{2}-\d{2}/.test(d.date)) return d.date.slice(0, 10);
      const raw = String(d.time || "");
      const m = raw.match(/(\d{4}-\d{2}-\d{2})/);
      if (m) return m[1];
      // dd-Mmm-YYYY / dd-Mmm-yy
      const m2 = raw.match(/(\d{1,2})[- ]([A-Za-z]{3})[- ](\d{2,4})/);
      if (m2) {
        const months = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
        const mon = months[m2[2].slice(0, 3)];
        if (mon != null) {
          let y = parseInt(m2[3], 10);
          if (y < 100) y += 2000;
          return isoDate(new Date(y, mon, parseInt(m2[1], 10)));
        }
      }
      return "";
    }

    function render() {
      const type = document.getElementById("typeFilter").value;
      const side = document.getElementById("sideFilter").value;
      const from = document.getElementById("fromDate").value;
      const to = document.getElementById("toDate").value;
      let deals = [...(TP.deals || [])];
      if (type !== "all") deals = deals.filter((d) => d.type === type);
      if (side !== "all") deals = deals.filter((d) => d.side === side);
      if (from || to) {
        deals = deals.filter((d) => {
          const key = dealDateKey(d);
          if (!key) return !from; // undated kept only when from is empty
          if (from && key < from) return false;
          if (to && key > to) return false;
          return true;
        });
      }

      const buyVal = deals.filter((d) => d.side === "Buy").reduce((a, d) => a + Number(d.value || 0), 0);
      const sellVal = deals.filter((d) => d.side === "Sell").reduce((a, d) => a + Number(d.value || 0), 0);

      document.getElementById("dealStats").innerHTML = `
        <article class="panel"><div class="panel-title">Prints shown</div><div class="stat-value">${deals.length}</div></article>
        <article class="panel"><div class="panel-title">Buy value</div><div class="stat-value up" style="font-size:1.5rem">₹${buyVal.toFixed(0)} Cr</div></article>
        <article class="panel"><div class="panel-title">Sell value</div><div class="stat-value down" style="font-size:1.5rem">₹${sellVal.toFixed(0)} Cr</div></article>
      `;

      document.getElementById("dealCount").textContent = `${deals.length} deals`;
      document.getElementById("dealList").innerHTML = deals.map((d) => `
        <article class="deal-item">
          <div>
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem">
              <strong class="symbol" style="font-size:1.05rem">${d.symbol}</strong>
              <span class="badge badge-neutral">${d.type}</span>
              ${TP.helpers.sideBadge(d.side)}
            </div>
            <div class="deal-meta">
              <span>${d.time || d.date || ""} IST</span>
              <span>Qty ${(d.qty != null && d.qty !== "") ? d.qty : "—"}</span>
              <span>₹${Number(d.value || 0).toFixed(1)} Cr</span>
              <span>${d.client}</span>
            </div>
            <p style="margin-top:0.45rem;font-size:0.88rem;color:var(--text-muted)">${d.note}</p>
          </div>
          <div>
            <a class="btn btn-ghost" style="padding:0.45rem 0.85rem;font-size:0.8rem" href="stock.html?symbol=${d.symbol}">Signal</a>
          </div>
        </article>
      `).join("") || `<p style="color:var(--text-muted)">No deals match filters for the selected dates.</p>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      setPresetDays(7);
      document.getElementById("rangePreset").addEventListener("change", () => {
        const v = document.getElementById("rangePreset").value;
        if (v !== "custom") setPresetDays(Number(v));
        render();
      });
      ["typeFilter", "sideFilter", "fromDate", "toDate"].forEach((id) => {
        document.getElementById(id).addEventListener("change", () => {
          if (id === "fromDate" || id === "toDate") {
            document.getElementById("rangePreset").value = "custom";
          }
          render();
        });
      });
      TPUI.whenReady(render);
      document.addEventListener("tp:deals", render);
      document.addEventListener("tp:ready", render);
    });
  </script>
</body>
</html>
